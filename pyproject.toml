[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lidar-slam-lanelet2-pipeline"
version = "0.1.0"
description = "Offline LiDAR SLAM to Lanelet2 mapping pipeline on KITTI, with a per-stage error budget"
requires-python = ">=3.10"
# Pinned to the versions the numbers in docs/ were produced with, so that a
# fresh install runs the same registration and solver code. The GTSAM 4.2
# wheels need numpy < 2.
dependencies = [
    "numpy==1.26.4",
    "gtsam==4.2",
    "kiss-icp==1.2.3",
    "open3d==0.19.0",
    "evo==1.35.2",
    "scipy==1.15.3",
    "pyproj==3.7.1",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pre-commit",
    "ruff",
]
nuscenes = [
    "nuscenes-devkit==1.2.0",
]
# Loading the exported map with Lanelet2 (tests and scripts/map_study.py lanelet2).
lanelet2 = [
    "lanelet2==1.2.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: integration tests requiring real KITTI data; opt-in via -m slow",
]
