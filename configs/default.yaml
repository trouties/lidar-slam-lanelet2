# Configuration of scripts/run_pipeline.py and the study scripts.

data:
  kitti_root: "~/data/kitti/odometry/dataset"
  sequence: "00"
  # Raise every beam's elevation by 0.205 deg (KITTI HDL-64E intrinsic
  # calibration error). Without it, odometry drift on KITTI 04 is 0.93 %
  # instead of 0.39 %, almost all of it vertical. See docs/evaluation.md.
  correct_kitti_scan: true

kiss_icp:
  max_range: 100.0
  min_range: 5.0
  voxel_size: 1.0

gtsam:
  # Sigmas are [tx, ty, tz] in m and [rx, ry, rz] in rad, per factor.
  # Odometry edge: from variance component estimation on the pose-graph
  # residuals (no ground truth involved), rounded. An overly loose rotation
  # sigma lets the graph bend the trajectory at almost no cost, so that small
  # inconsistencies between loop closures turn into metre-level distortion.
  # See docs/loop-closure.md.
  odom_sigmas: [0.01, 0.01, 0.01, 0.0005, 0.0005, 0.0005]
  prior_sigmas: [0.01, 0.01, 0.01, 0.001, 0.001, 0.001]
  # Refined loop closure: RMS error against KITTI ground truth on the loops of
  # sequence 05 whose two ends both have an RTK-integer GPS fix. Elsewhere the
  # ground truth is less accurate than the registration (docs/loop-closure.md).
  loop_closure_sigmas: [0.1, 0.1, 0.1, 0.002, 0.001, 0.006]

degeneracy:
  # Per-frame condition number of the translation Hessian of the scan-to-scan
  # registration (src/odometry/degeneracy.py), written to
  # results/degeneracy_XX.csv as a Stage 2 diagnostic. Stage 3 does not use
  # it: relaxing the odometry edges of degenerate frames did not improve the
  # pose graph (docs/loop-closure.md).
  enabled: true
  max_correspondences: 5000       # per-frame correspondence cap (random subsample)
  normal_k: 15                    # neighbours of the PCA normal
  max_nn_dist: 1.0                # m; correspondences farther apart are dropped
  voxel_size: 0.3                 # m; voxel of both scans before matching
  min_quality: 0.5                # keep planar neighbourhoods only, (l2-l1)/l3
  # Frames above this are flagged in the CSV. It is the 95th percentile on
  # KITTI 00, i.e. a definition of "unusual for an urban drive", not a
  # physical limit.
  cond_threshold: 5.514
  # Edge relaxation, used only by the comparison in
  # scripts/loop_closure_study.py analyze: on frames in a run of at least
  # min_consecutive frames above the threshold (after EMA smoothing), the
  # sigma along the least-observed direction is multiplied by
  # sigma_inflation_factor.
  sigma_inflation_factor: 10.0
  ema_alpha: 0.3
  min_consecutive: 5

loop_closure:
  min_frame_gap: 100
  icp_fitness_threshold: 0.9
  # Voxel size (m) of the point-to-point ICP that verifies a candidate.
  icp_downsample_voxel: 1.0
  scan_context:
    num_rings: 20
    num_sectors: 60
    max_range: 80.0
    distance_threshold: 0.4      # SC cosine distance threshold for a candidate
    top_k: 25                    # ring-key candidates to re-rank per query
    # Query every 10th frame (about 1 s of driving). Loop closures from
    # neighbouring frames of one revisit share the scene and the odometry
    # prior, so their errors are correlated; querying every frame multiplied
    # the weight of a revisit by its length.
    query_stride: 10
    max_matches_per_query: 5     # cap per-frame matches; 0 = unlimited
  # Coarse-to-fine point-to-plane ICP that replaces the relative pose of every
  # accepted candidate, started from the odometry prior. Stages are
  # [voxel size m, max correspondence distance m].
  refine:
    stages: [[2.0, 5.0], [1.0, 2.0], [0.5, 1.0]]
    max_iteration: 50
  # A candidate rejected from the odometry prior is refined again from the
  # Scan Context alignment (descriptor yaw, no translation) and verified from
  # there: where the odometry has drifted beyond the verification ICP's reach,
  # no candidate of a revisit could be accepted otherwise (docs/loop-closure.md).
  retry_from_scan_context: true
  # Reject loop closures that move the second scan, relative to the odometry,
  # by more than this fraction of the path driven between the two scans.
  # Above the odometry's worst per-sequence t_rel on KITTI (0.82 %); the
  # retry's false matches need 2.48 % or more, its true ones at most 0.46 %.
  max_drift_ratio: 0.01
  # Optional M-estimator on loop-closure factors only. Off: with the settings
  # above, a Cauchy kernel (scale 1) changes SE(3) APE by at most 0.03 m on
  # KITTI 00-10 (docs/loop-closure.md).
  robust_kernel: none            # none | cauchy
  robust_scale: 1.0              # kernel scale in whitened units (sigmas)

mapping:
  # Map accumulated from the Stage 3 poses at this voxel (KITTI 00: 28 M
  # points); the curb extraction re-voxelizes it to voxel_size.
  master_voxel_size: 0.10
  voxel_size: 0.15             # m; working voxel of the curb extraction
  max_range: 30.0              # m; scan points farther away are not mapped
  downsample_every: 500        # frames between incremental voxel merges
  # Curbs: cells of an xy grid whose height range is a 10-25 cm step that
  # straddles curb_road_z_top. Heights are in the frame of the nearest pose,
  # where the road under the car is at about -1.73 m. The road falls away
  # towards its edges, so a fixed straddle height misses many low curbs
  # (docs/map-quality.md).
  curb_grid_size: 0.30         # m; 2x voxel_size, so a cell holds several voxels
  curb_z_min: -2.0             # m; height pre-filter
  curb_z_max: -1.2
  curb_height_min: 0.10        # m; minimum step height
  curb_height_max: 0.25        # m; taller steps are walls, vehicles, vegetation
  curb_road_z_top: -1.55       # m; 18 cm above the road under the car
  curb_dbscan_eps: 0.6         # m; two grid cells
  curb_dbscan_min_points: 10   # DBSCAN core neighbourhood size
  curb_trim_k: 1.2             # MAD trim across the cluster axis, in robust sigmas

export:
  # GNSS/INS logs of the KITTI Raw drives (OxTS). When the drive behind the
  # sequence is present, the map is georeferenced with them (src/export/georef.py).
  kitti_raw_root: ~/data/kitti_raw
  lat0: 49.0                       # without a GNSS log: map origin placed here, axes on the UTM grid,
  lon0: 8.4                        # not georeferenced
  polyline_bin_size: 0.5           # m; bin width along a cluster when reducing it to a polyline
  polyline_simplify_epsilon: 0.05  # m; Ramer-Douglas-Peucker tolerance; 0 disables
  curb:                            # a curb cluster is exported if it is a line:
    min_linearity: 0.75            # PCA linearity (l1-l2)/l1 in xy
    min_length: 1.0                # m; extent along the principal axis (2-98 %)
    max_thickness: 0.7             # m; extent across it, after an optional second trim
    trim_k: 1.0                    # MAD trim of that second pass, in robust sigmas

cache:
  enabled: true
  root: "cache/kitti"          # relative to the repository root; see src/cache/layered_cache.py

output:
  dir: "results"
