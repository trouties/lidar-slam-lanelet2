# One-command reproduction: the pipeline on the first 200 frames of KITTI 00.
#
#   docker compose build
#   docker compose up
#
# Outputs land on the host under ./results/docker/ (ape.txt, trajectory.png and the
# pipeline outputs). The 200-frame subset is downloaded from
# KITTI_SUBSET_URL on the first run and kept under ./data_subset; a subset
# extracted there by hand (scripts/package_kitti_subset.py) is used as is.

services:
  pipeline:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: lidar-slam-lanelet2:latest
    environment:
      KITTI_SUBSET_URL: "${KITTI_SUBSET_URL:-}"
      KITTI_SUBSET_SHA256: "${KITTI_SUBSET_SHA256:-}"
      SEQUENCE: "00"
      MAX_FRAMES: "200"
    volumes:
      - ./results/docker:/app/results
      - ./data_subset:/data
    # Lets the container reach a tarball served from the host
    # (scripts/docker_check.sh cold); Docker Desktop maps it by itself.
    extra_hosts:
      - "host.docker.internal:host-gateway"
